# Необязательный локальный PostgreSQL.
# На Railway база создаётся отдельным сервисом Postgres — этот файл для разработки.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svoi
    ports:
      - "5432:5432"
    volumes:
      - svoi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d svoi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  svoi_pgdata:
